<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>Todo Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="noise"></div>

    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="#" aria-label="Todo Space">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M7 12.5l3 3 7-7"/><path d="M21 12a9 9 0 1 1-5.3-8.2"/></svg>
                </span>
                <span>todo<span>space</span></span>
            </a>
            <div class="today">
                <span class="today-dot"></span>
                <span id="currentDate">Сьогодні</span>
            </div>
        </header>

        <section class="hero">
            <div>
                <p class="eyebrow">Твій фокус на сьогодні</p>
                <h1>Що будемо<br><span>робити?</span></h1>
                <p class="subtitle">Додавай завдання, звільняй думки<br>та рухайся вперед у своєму темпі.</p>
            </div>
            <div class="progress-card" aria-label="Прогрес виконання завдань">
                <div class="progress-ring" id="progressRing">
                    <div>
                        <strong id="progressValue">0%</strong>
                        <span>виконано</span>
                    </div>
                </div>
                <p><strong id="completedCount">0</strong> завершено</p>
            </div>
        </section>

        <section class="workspace">
            <div class="composer">
                <span class="composer-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </span>
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Наприклад, підготувати презентацію"
                    autocomplete="off"
                    onkeydown="if(event.key==='Enter') addTask()"
                >
                <button class="btn-add" onclick="addTask()">
                    <span>Додати</span>
                    <svg viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg>
                </button>
            </div>

            <div class="toolbar">
                <div class="filters" aria-label="Фільтр завдань">
                    <button onclick="filterTasks('all')" class="active" id="filter-all">Усі</button>
                    <button onclick="filterTasks('active')" id="filter-active">У процесі</button>
                    <button onclick="filterTasks('completed')" id="filter-completed">Виконані</button>
                </div>
                <button class="btn-clear" onclick="clearCompleted()">
                    <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M9 7l1-3h4l1 3M6 7l1 14h10l1-14"/></svg>
                    Очистити виконані
                </button>
            </div>

            <div class="list-heading">
                <h2>Мої завдання</h2>
                <span id="taskCounter">0 завдань</span>
            </div>

            <ul id="taskList"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
